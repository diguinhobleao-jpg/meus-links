<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossos Canais</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background-color: #161c2c;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2563eb;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      color: #ffffff;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-whatsapp {
      background-color: #25d366;
    }
    .btn-telegram {
      background-color: #229ed9;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Imagem de perfil (pode trocar a URL depois) -->
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200&h=200&fit=crop" alt="Foto de Perfil" class="avatar">

    <h1>Seu Nome / Canal</h1>
    <p>Promoções diárias, cupons exclusivos e alertas em tempo real direto no seu telemóvel.</p>

    <div class="btn-container">
      <!-- Troque pelo link do seu grupo ou contacto -->
      <a href="https://whatsapp.com" target="_blank" class="btn btn-whatsapp">
        Entrar no WhatsApp
      </a>

      <!-- Troque pelo link do seu canal -->
      <a href="https://telegram.org" target="_blank" class="btn btn-telegram">
        Entrar no Telegram
      </a>
    </div>
  </div>

</body>
</html>
