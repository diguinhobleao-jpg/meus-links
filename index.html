<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Promo Express</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Foto de Perfil com brilho e indicador de status */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .avatar {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 25px rgba(255, 180, 0, 0.25);
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background-color: #00e676;
      border: 3px solid #000000;
      border-radius: 50%;
    }

    /* Título com destaque */
    .title-white {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .title-orange {
      font-size: 26px;
      font-weight: 900;
      color: #ff9800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* Selos de destaque */
    .badges {
      display: flex;
      gap: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e0e0e0;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* Botões de Ação */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 0.5px;
      color: #ffffff;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn i {
      font-size: 19px;
    }

    .btn-whatsapp {
      background-color: #00c853;
    }

    .btn-whatsapp:hover {
      filter: brightness(1.08);
    }

    .btn-telegram {
      background-color: #0088cc;
    }

    .btn-telegram:hover {
      filter: brightness(1.08);
    }

    /* Texto de rodapé */
    .footer-text {
      color: #b0b0b0;
      font-size: 13px;
      line-height: 1.5;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logótipo da Promo Express -->
    <div class="avatar-wrapper">
      <img src="logo.png" alt="Promo Express" class="avatar">
      <div class="status-dot"></div>
    </div>

    <!-- Título Principal -->
    <div class="title-white">CHEGA DE</div>
    <div class="title-orange">PAGAR CARO!</div>

    <!-- Tags informativas -->
    <div class="badges">
      <span>100% GRÁTIS</span>
      <span>•</span>
      <span>+200.000 MEMBROS</span>
    </div>

    <!-- Botões -->
    <div class="btn-group">
      <!-- Cole o link de convite do seu WhatsApp no href -->
      <a href="https://chat.whatsapp.com/EE7yw12WTW9Dep5hz9EV2V" target="_blank" class="btn btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>ENTRE NO GRUPO VIP DO WHATSAPP</span>
      </a>

      <!-- Cole o link do seu Telegram no href -->
      <a href="https://t.me/miopeofertas" target="_blank" class="btn btn-telegram">
        <i class="fa-brands fa-telegram"></i>
        <span>ENTRE NO CANAL DO TELEGRAM</span>
      </a>
    </div>

    <!-- Texto de Apoio -->
    <p class="footer-text">
      entre no nosso grupo VIP e receba as melhores promoções da internet todos os dias!
    </p>
  </div>

</body>
</html>
